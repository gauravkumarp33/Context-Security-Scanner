name: Context-Aware Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    name: Run Scanner & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # Release tag: actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        # Release tag: actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[dev]

      - name: Run unit & integration tests
        run: |
          pytest -v

      - name: Build and install package smoke check
        run: python scripts/package_smoke.py

      - name: Compile and test VS Code extension
        working-directory: vscode-extension
        run: |
          npm ci
          npm run compile
          npm test

      - name: Run Context-Aware Security Scanner CLI
        run: |
          echo "Scanning repository for insecure configurations and exposed secrets..."
          code-security-scanner scan . --format human --fail-on high --exclude "tests/*"
