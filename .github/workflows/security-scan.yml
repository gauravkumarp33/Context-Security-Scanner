name: Context-Aware Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    name: Run Scanner & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit & integration tests
        run: |
          pytest -v

      - name: Run Context-Aware Security Scanner CLI
        run: |
          echo "Scanning repository for insecure configurations and exposed secrets..."
          code-security-scanner scan . --format human --fail-on high --exclude "tests/*"
