[project]
name = "context-security-scanner"
version = "0.1.0"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "jsonschema",
    "pytest",
]

[project.scripts]
code-security-scanner = "scanner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
