rules:
  - id: secret-aws-access-key
    title: "AWS Access Key"
    severity: "critical"
    message: "Hardcoded AWS Access Key ID exposed in plaintext allows unauthorized actors to compromise cloud infrastructure."
    recommendation: "Store AWS credentials in environment variables such as AWS_ACCESS_KEY_ID or use IAM roles."
    engine: "regex"
    pattern: '(?<![A-Z0-9])(?:AKIA|ABIA|ACCA|ASIA)[0-9A-Z]{16}(?![A-Z0-9])'
    file_globs:
      - "*"
    raise_in_production: true
    what_it_detects: "Hardcoded AWS Access Key ID tokens in source files or configuration."
    why_risky: "Attackers with repository access can hijack cloud resources, delete data, and incur extensive infrastructure costs."
    bad_example: |
      AWS_ACCESS_KEY_ID = "AKIAIOSFODNN7EXAMPLE"
    fixed_example: |
      import os
      AWS_ACCESS_KEY_ID = os.environ.get("AWS_ACCESS_KEY_ID")

  - id: secret-github-token
    title: "GitHub Personal Access Token"
    severity: "high"
    message: "Hardcoded GitHub token exposed in source code allows unauthorized access to repositories and automated workflows."
    recommendation: "Revoke the exposed token and inject it dynamically using GitHub Secrets or the GITHUB_TOKEN environment variable."
    engine: "regex"
    pattern: '(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{36,}|github_pat_[A-Za-z0-9_]{22,}'
    file_globs:
      - "*"
    raise_in_production: true
    what_it_detects: "Hardcoded GitHub personal access tokens and OAuth tokens."
    why_risky: "Leaked tokens allow attackers to tamper with repository source code, release tags, and CI/CD automation."
    bad_example: |
      GITHUB_TOKEN = "ghp_EXAMPLE_TOKEN_PLACEHOLDER_STRING_12345"
    fixed_example: |
      import os
      GITHUB_TOKEN = os.environ.get("GITHUB_TOKEN")

  - id: secret-stripe-key
    title: "Stripe API Key"
    severity: "high"
    message: "Hardcoded Stripe API key detected in plaintext allows unauthorized actors to access payment processing and customer financial data."
    recommendation: "Revoke the exposed key in the Stripe Dashboard and load keys via the STRIPE_API_KEY environment variable."
    engine: "regex"
    pattern: '(?:sk|pk)_(?:test|live)_[0-9a-zA-Z]{24,}'
    file_globs:
      - "*"
    raise_in_production: true
    what_it_detects: "Hardcoded Stripe live or test secret API keys."
    why_risky: "Exposed keys can lead to fraudulent transactions, customer record exposure, and financial liability."
    bad_example: |
      stripe.api_key = "sk_live_EXAMPLE_STRIPE_KEY_PLACEHOLDER_12345"
    fixed_example: |
      import os
      stripe.api_key = os.environ.get("STRIPE_API_KEY")

  - id: secret-private-key
    title: "Private Cryptographic Key"
    severity: "critical"
    message: "Hardcoded private cryptographic key header detected in source code compromises encrypted communications and server authentication."
    recommendation: "Remove the private key from source control and load it securely from an external key vault."
    engine: "regex"
    pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
    file_globs:
      - "*"
    raise_in_production: true
    what_it_detects: "Plaintext RSA, EC, DSA, and OpenSSH private key PEM headers."
    why_risky: "Exposed private keys compromise encrypted channels, digital signatures, and server authentication."
    bad_example: |
      -----BEGIN RSA PRIVATE KEY-----
      MIIE...<RUNTIME_SAFE_KEY_PLACEHOLDER>...
      -----END RSA PRIVATE KEY-----
    fixed_example: |
      from key_vault import load_secret
      private_key_pem = load_secret("APP_PRIVATE_KEY")

  - id: secret-db-connection-string
    title: "Database Connection String with Password"
    severity: "critical"
    message: "Database connection URL contains embedded plaintext credentials, allowing unauthorized database access if exposed."
    recommendation: "Extract database credentials to environment variables and build connection URLs dynamically at runtime."
    engine: "regex"
    pattern: '(?:postgres|postgresql|mysql|mongodb(?:\+srv)?|redis)://[^:\s''"]+:([^@\s''"]+)@[^\s''"]+'
    file_globs:
      - "*"
    raise_in_production: true
    what_it_detects: "Database connection URLs containing embedded passwords."
    why_risky: "Hardcoded connection strings expose database instances directly to credential theft and unauthorized data dumping."
    bad_example: |
      DB_URL = "postgresql://dbuser:secretpass@db.internal:5432/proddb"
    fixed_example: |
      import os
      DB_URL = f"postgresql://{os.environ['DB_USER']}:{os.environ['DB_PASS']}@{os.environ['DB_HOST']}:5432/proddb"

  - id: secret-generic-password
    title: "Hardcoded Password or API Key Assignment"
    severity: "medium"
    message: "Hardcoded password or API key assignment in source code exposes sensitive credentials to unauthorized readers."
    recommendation: "Inject secrets dynamically from environment variables or a secret vault instead of hardcoding values."
    engine: "regex"
    pattern: '(?i)(?:password|passwd|api_key|apikey|secret_key)\s*[:=]\s*["'']([^"''\r\n]{4,})["'']'
    file_globs:
      - "*"
    raise_in_production: false
    what_it_detects: "Generic password, passwd, or API key variable assignments."
    why_risky: "Plaintext secrets in source code persist in commit history and are easily leaked to third parties."
    bad_example: |
      password = "supersecretpassword123"
    fixed_example: |
      import os
      password = os.environ.get("SERVICE_PASSWORD")
