rules:
  - id: secret-aws-access-key
    title: "AWS Access Key"
    severity: "critical"
    message: "Hardcoded AWS Access Key ID detected."
    recommendation: "Store AWS credentials in environment variables or use IAM roles / AWS Secrets Manager."
    engine: "regex"
    pattern: '(?<![A-Z0-9])(?:AKIA|ABIA|ACCA|ASIA)[0-9A-Z]{16}(?![A-Z0-9])'
    file_globs:
      - "*"

  - id: secret-github-token
    title: "GitHub Personal Access Token"
    severity: "high"
    message: "Hardcoded GitHub token detected."
    recommendation: "Revoke the exposed token and use GitHub Secrets or environment variables."
    engine: "regex"
    pattern: '(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{36,}|github_pat_[A-Za-z0-9_]{22,}'
    file_globs:
      - "*"

  - id: secret-stripe-key
    title: "Stripe API Key"
    severity: "high"
    message: "Hardcoded Stripe API key detected."
    recommendation: "Use environment variables or a secrets manager for Stripe secret keys."
    engine: "regex"
    pattern: '(?:sk|pk)_(?:test|live)_[0-9a-zA-Z]{24,}'
    file_globs:
      - "*"

  - id: secret-private-key
    title: "Private Cryptographic Key"
    severity: "critical"
    message: "Hardcoded private cryptographic key header detected."
    recommendation: "Never commit private keys to source control. Store keys in secure key management services."
    engine: "regex"
    pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
    file_globs:
      - "*"

  - id: secret-db-connection-string
    title: "Database Connection String with Password"
    severity: "critical"
    message: "Database connection URL with embedded password detected."
    recommendation: "Extract database credentials to environment variables or use IAM database authentication."
    engine: "regex"
    pattern: '(?:postgres|postgresql|mysql|mongodb(?:\+srv)?|redis)://[^:\s''"]+:([^@\s''"]+)@[^\s''"]+'
    file_globs:
      - "*"

  - id: secret-generic-password
    title: "Hardcoded Password or API Key Assignment"
    severity: "medium"
    message: "Hardcoded password or API key assignment detected."
    recommendation: "Inject secrets dynamically from environment variables or a secret vault."
    engine: "regex"
    pattern: '(?i)(?:password|passwd|api_key|apikey|secret_key)\s*[:=]\s*["'']([^"''\r\n]{4,})["'']'
    file_globs:
      - "*"
